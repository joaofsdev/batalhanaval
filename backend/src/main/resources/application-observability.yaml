# Perfil de observabilidade — ativado com: --spring.profiles.active=dev,observability
# Expõe métricas, detecta slow queries/requests, escuta em todas as interfaces

server:
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: batalhanaval-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
  tracing:
    enabled: false

observability:
  slow-request:
    threshold-ms: 500
  slow-query:
    threshold-ms: 200

logging:
  level:
    com.softexpert.batalhanaval_api.config.observability: DEBUG
